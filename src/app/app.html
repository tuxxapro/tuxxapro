<header class="site-header">
  <div class="container header-container">
    <!-- Logotipo Oficial Integrado (Ícone + Brand na mesma imagem) -->
    <a routerLink="/" class="brand-logo" aria-label="TUXXA - INFRAESTRUTURA EM MOVIMENTO" (click)="closeMobileMenu()">
      <img
        src="images/tuxxa-brand-nav.png"
        alt="TUXXA - INFRAESTRUTURA EM MOVIMENTO"
        class="brand-nav-image"
      />
    </a>

    <!-- Bloco Direito: Navegação + CTA + Menu Mobile -->
    <div class="header-right">
      <nav class="nav-desktop" aria-label="Navegação Principal">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          Início
        </a>
        <a
          routerLink="/sobre"
          routerLinkActive="active"
          class="nav-link"
        >
          Sobre
        </a>
      </nav>

      <a href="mailto:tuxxa.contato@gmail.com" class="btn btn-primary btn-sm header-cta">
        <span>Fale Conosco</span>
      </a>

      <!-- Botão Menu Mobile -->
      <button
        class="mobile-menu-btn"
        type="button"
        aria-label="Abrir menu"
        (click)="toggleMobileMenu()"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path *ngIf="!mobileMenuOpen()" d="M4 6h16M4 12h16M4 18h16" />
          <path *ngIf="mobileMenuOpen()" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Menu Mobile Drawer -->
  <div class="mobile-nav-drawer" [class.is-open]="mobileMenuOpen()">
    <nav aria-label="Navegação Mobile">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-nav-link"
        (click)="closeMobileMenu()"
      >
        Início
      </a>
      <a
        routerLink="/sobre"
        routerLinkActive="active"
        class="mobile-nav-link"
        (click)="closeMobileMenu()"
      >
        Sobre
      </a>
      <div class="mobile-cta-box">
        <a href="mailto:tuxxa.contato@gmail.com" class="btn btn-primary" style="width: 100%">
          Falar Conosco
        </a>
      </div>
    </nav>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <div class="container footer-container">
    <div class="footer-copy">
      &copy; 2026 TUXXA. INFRAESTRUTURA EM MOVIMENTO. Todos os direitos reservados.
    </div>
    <div class="footer-contact">
      <a href="mailto:tuxxa.contato@gmail.com">tuxxa.contato&#64;gmail.com</a>
    </div>
  </div>
</footer>
